<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseline — Tennis Club &amp; Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.1.18/+esm" } }
</script>
<style>
:root{
  --background:#ffffff; --foreground:#0a0a0a;
  --brand:#2563c9; --brand-deep:#0f2f63; --brand-light:#5790e6; --accent-teal:#0b6e97;
  --surface:#f4f4f4; --surface-card:#ffffff;
  --ink:#0a0a0a; --ink-soft:#717784; --ghost:#d7dae1; --hairline:#e6e8ec; --on-brand:#ffffff;
  --radius-card:1.5rem; --radius-card-lg:2rem; --radius-pill:62.5rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
@media (max-width:1920px){ html{ font-size:0.833333vw; } }
@media (max-width:1440px){ html{ font-size:1.111111vw; } }
@media (max-width:1024px){ html{ font-size:1.5625vw; } }
@media (max-width:640px){ html{ font-size:4.444444vw; } }
img,picture{display:block;max-width:100%;}
button{cursor:pointer;font:inherit;color:inherit;background:none;border:none;}
a{color:inherit;text-decoration:none;}
ul,ol{list-style:none;}
input,textarea{font:inherit;}
body{min-height:100vh;background:#fff;color:var(--foreground);font-family:"Onest",system-ui,sans-serif;font-weight:400;}
:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px;}
[hidden]{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

main{width:100%;overflow-x:clip;padding:0.5rem;}
@media (min-width:640px){ main{ padding:0.75rem; } }

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:200;background:var(--brand-deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;transition:transform 850ms cubic-bezier(0.65,0,0.35,1);}
.loader.exit{transform:translateY(-105%);}
.loader__mark{display:flex;align-items:center;gap:0.5rem;opacity:0;transform:translateY(16px);transition:opacity .5s cubic-bezier(0.16,1,0.3,1),transform .5s cubic-bezier(0.16,1,0.3,1);}
.loader__mark.in{opacity:1;transform:translateY(0);}
.loader__mark svg{width:1.75rem;height:1.75rem;}
.loader__wordmark{font-size:1.5rem;font-weight:500;text-transform:uppercase;letter-spacing:0.2em;}
.loader__track{width:10rem;height:1px;border-radius:var(--radius-pill);background:rgba(255,255,255,.2);overflow:hidden;}
.loader__fill{width:100%;height:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform 1280ms cubic-bezier(0.65,0,0.35,1);}
.loader__fill.in{transform:scaleX(1);}

/* ---------- shared components ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.75rem;font-weight:500;text-transform:uppercase;letter-spacing:0.22em;}
.eyebrow__dot{width:0.375rem;height:0.375rem;border-radius:var(--radius-pill);flex-shrink:0;}
.eyebrow.dark{color:var(--ink-soft);}
.eyebrow.dark .eyebrow__dot{background:var(--brand);}
.eyebrow.light{color:rgba(255,255,255,.7);}
.eyebrow.light .eyebrow__dot{background:var(--brand-light);}

.clip-line{display:block;overflow:hidden;padding-bottom:0.14em;}
.clip-line__inner{display:block;transform:translateY(115%);opacity:0;transition:transform 950ms cubic-bezier(0.16,1,0.3,1),opacity 950ms cubic-bezier(0.16,1,0.3,1);}
.clip-line__inner.in{transform:translateY(0);opacity:1;}

.clip-word{display:inline-block;overflow:hidden;padding-bottom:0.12em;vertical-align:top;}
.clip-word__inner{display:inline-block;transform:translateY(115%);opacity:0;transition:transform 1100ms cubic-bezier(0.16,1,0.3,1),opacity 1100ms cubic-bezier(0.16,1,0.3,1);}
.clip-word__inner.in{transform:translateY(0);opacity:1;}

.word-fade{display:inline-block;transform:translateY(18px);opacity:0;transition:transform 700ms cubic-bezier(0.25,1,0.5,1),opacity 700ms cubic-bezier(0.25,1,0.5,1);}
.word-fade.in{transform:translateY(0);opacity:1;}

.pill-btn{display:inline-flex;align-items:center;gap:0.5rem;border-radius:var(--radius-pill);padding:0.875rem 1.75rem;font-size:0.875rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;transition:background .3s,color .3s;white-space:nowrap;}
.pill-btn__arrow{width:1rem;height:1rem;transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);flex-shrink:0;}
.pill-btn.light{background:#fff;color:var(--brand-deep);}
.pill-btn.solid{background:var(--ink);color:#fff;}
.pill-btn.outline{background:transparent;color:var(--ink);border:1px solid currentColor;}
@media (min-width:769px){
  .pill-btn:hover .pill-btn__arrow{transform:translateX(5px);}
  .pill-btn.light:hover{background:var(--brand-light);color:#fff;}
  .pill-btn.solid:hover{background:var(--brand-deep);}
  .pill-btn.outline:hover{background:var(--ink);color:#fff;}
}

.arrow-btn{width:3rem;height:3rem;border-radius:var(--radius-pill);display:grid;place-items:center;border:1px solid transparent;transition:background .3s,border-color .3s,color .3s;flex-shrink:0;}
@media (min-width:640px){ .arrow-btn{ width:3.5rem; height:3.5rem; } }
.arrow-btn svg{width:1.25rem;height:1.25rem;transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);}
.arrow-btn.prev svg{transform:scaleX(-1);}
.arrow-btn.outline{border-color:var(--hairline);color:var(--ink);}
.arrow-btn.solid{background:var(--ink);border-color:var(--ink);color:#fff;}
@media (min-width:769px){
  .arrow-btn:hover svg{transform:scale(1.15);}
  .arrow-btn.prev:hover svg{transform:scaleX(-1) scale(1.15);}
  .arrow-btn.outline:hover{border-color:var(--ink);}
  .arrow-btn.solid:hover{background:var(--brand-deep);border-color:var(--brand-deep);}
}

.dots{display:flex;align-items:center;gap:0.5rem;}
.dot{padding:0.375rem;}
.dot__pill{display:block;height:0.375rem;width:0.375rem;border-radius:var(--radius-pill);transition:width .3s,background .3s;}
.dots.dark .dot__pill{background:var(--ghost);}
.dots.dark .dot[aria-current="true"] .dot__pill{width:1.25rem;background:var(--ink);}
.dots.light .dot__pill{background:rgba(255,255,255,.4);}
.dots.light .dot[aria-current="true"] .dot__pill{width:1.25rem;background:#fff;}

/* ---------- header ---------- */
.site-header{position:relative;z-index:20;display:flex;align-items:center;padding:1.5rem 1.5rem 0;font-size:0.75rem;color:#fff;}
@media (min-width:640px){ .site-header{ padding:2rem 2.5rem 0; } }
.site-header__col{flex:1;display:flex;align-items:center;min-width:0;}
.site-header__nav{display:none;gap:2rem;}
@media (min-width:1024px){ .site-header__nav{ display:flex; } }
.site-header__nav a{color:rgba(255,255,255,.9);transition:color .3s;}
@media (min-width:769px){ .site-header__nav a:hover{ color:#fff; } }
.site-header__brand{justify-content:center;display:flex;align-items:center;gap:0.5rem;font-size:1rem;font-weight:500;text-transform:uppercase;letter-spacing:0.2em;white-space:nowrap;}
.site-header__brand svg{width:1.25rem;height:1.25rem;flex-shrink:0;}
.site-header__actions{justify-content:flex-end;gap:1rem;}
@media (min-width:640px){ .site-header__actions{ gap:1.25rem; } }
.btn-text-visit{display:none;text-transform:uppercase;letter-spacing:0.05em;}
@media (min-width:640px){ .btn-text-visit{ display:inline; } }
@media (min-width:769px){ .btn-text-visit:hover{ text-decoration:underline; } }
.burger{width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:var(--radius-pill);background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s;flex-shrink:0;}
@media (min-width:769px){ .burger:hover{ background:rgba(255,255,255,.25); } }
.burger__bars{display:flex;flex-direction:column;gap:0.3125rem;}
.burger__bar{width:1rem;height:1px;background:#fff;display:block;}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-card-lg);background:var(--brand-deep);color:#fff;height:calc(100svh - 1rem);min-height:36rem;display:flex;flex-direction:column;}
@media (min-width:640px){ .hero{ height:calc(100svh - 1.5rem); } }
.hero__bg{position:absolute;inset:0;z-index:-10;}
.hero__bg-inner{position:absolute;left:0;right:0;top:-16%;height:132%;width:100%;will-change:transform;}
.hero__bg-inner img{width:100%;height:100%;object-fit:cover;}
.hero__overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(15,47,99,.65), rgba(15,47,99,.35), rgba(15,47,99,.75));}
.hero__title-wrap{padding:1rem 1.5rem 0;}
@media (min-width:640px){ .hero__title-wrap{ padding-left:2.5rem; padding-right:2.5rem; } }
.hero__title{font-size:12.5vw;font-weight:500;text-transform:uppercase;line-height:0.85;letter-spacing:-0.02em;white-space:nowrap;}
.hero__bottom{margin-top:auto;display:flex;flex-direction:column;gap:1.5rem;padding:0 1.5rem 2rem;}
@media (min-width:640px){ .hero__bottom{ flex-direction:row; justify-content:space-between; align-items:flex-end; padding:0 2.5rem 2.5rem; } }
.hero__tagline{font-size:2.4rem;font-weight:500;text-transform:uppercase;line-height:.95;letter-spacing:-0.01em;color:rgba(255,255,255,.85);}
.hero__cluster{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;}

.hero__slider{display:none;width:16rem;flex-direction:column;gap:0.75rem;}
@media (min-width:768px){ .hero__slider{ display:flex; } }
.slider-card{display:flex;gap:0.75rem;border-radius:1.5rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);padding:0.75rem;box-shadow:0 1rem 2rem rgba(15,47,99,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.slider-card__img{width:3.5rem;height:3.5rem;border-radius:0.75rem;overflow:hidden;flex-shrink:0;}
.slider-card__img img{width:100%;height:100%;object-fit:cover;}
.slider-card__body{display:flex;flex-direction:column;gap:0.2rem;min-width:0;justify-content:center;}
.slider-card__brand{font-size:0.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.slider-card__title{font-size:0.7rem;text-transform:uppercase;opacity:.8;}
.slider-card__cta{font-size:0.65rem;text-decoration:underline;margin-top:0.15rem;display:inline-block;}

.hero__membership{width:100%;max-width:20rem;border-radius:1.5rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);padding:0.75rem;box-shadow:0 1rem 2rem rgba(15,47,99,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:stretch;gap:0.75rem;}
@media (min-width:640px){ .hero__membership{ max-width:15rem; } }
.membership__left{display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
.membership__value{font-size:1.875rem;font-weight:500;line-height:1;}
.membership__dots{display:flex;}
.membership__dot{width:1.25rem;height:1.25rem;border-radius:var(--radius-pill);border:1px solid rgba(15,47,99,.4);margin-left:-0.5rem;}
.membership__dot:first-child{margin-left:0;}
.membership__caption{font-size:0.65rem;opacity:.8;}
.membership__img{width:4rem;aspect-ratio:3/4;border-radius:0.75rem;overflow:hidden;flex-shrink:0;}
.membership__img img{width:100%;height:100%;object-fit:cover;}

/* ---------- trust ---------- */
.trust{position:relative;isolation:isolate;overflow:hidden;background:var(--background);padding:4rem 1.5rem;}
@media (min-width:640px){ .trust{ padding:5rem 2.5rem; } }
.trust__badges{position:relative;z-index:20;display:flex;flex-direction:column;gap:1.5rem;}
@media (min-width:640px){ .trust__badges{ flex-direction:row; justify-content:space-between; align-items:flex-start; } }
.badge-percent{width:7rem;height:7rem;border-radius:var(--radius-pill);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex-shrink:0;}
@media (min-width:640px){ .badge-percent{ width:8rem; height:8rem; } }
.badge-percent__value{font-size:1.5rem;font-weight:500;}
.badge-percent__caption{font-size:0.6rem;color:var(--ink-soft);max-width:7em;margin-top:.25rem;}
.badge-card{max-width:28rem;display:flex;flex-direction:column;gap:1rem;border-radius:1.5rem;background:var(--surface);padding:1.25rem;}
@media (min-width:640px){ .badge-card{ gap:1.25rem; padding:1.5rem; } }
.badge-card__index{align-self:flex-start;border-radius:0.75rem;background:var(--background);padding:0.5rem 1rem;font-size:1.25rem;font-weight:500;}
.badge-card__title{font-size:1.125rem;font-weight:500;}
.badge-card__body{font-size:0.75rem;color:var(--ink-soft);line-height:1.6;margin-top:0.5rem;}

.ghost-heading{pointer-events:none;position:relative;z-index:0;user-select:none;max-width:88rem;margin:3rem auto 0;font-size:8.2vw;font-weight:500;text-transform:uppercase;line-height:1.02;letter-spacing:-0.01em;}
.ghost-row{display:flex;justify-content:space-between;}
.ghost-word{color:var(--ghost);display:inline-block;will-change:transform;}
.ghost-word.ink{color:var(--ink);}

.coach-card{position:relative;z-index:10;margin:2rem auto 0;width:13rem;transform:rotate(6deg);}
@media (min-width:640px){ .coach-card{ width:16rem; position:absolute; left:50%; top:50%; margin:0; transform:translate(-50%,-50%) rotate(6deg); } }
.coach-card figure{position:relative;aspect-ratio:3/4;border-radius:1.5rem;background:var(--brand);overflow:hidden;}
.coach-card__img-wrap{position:absolute;inset:0;}
.coach-card__img-wrap img{width:100%;height:100%;object-fit:cover;}
.coach-card__caption{position:absolute;left:0.75rem;right:0.75rem;bottom:0.75rem;border-radius:0.75rem;background:rgba(15,47,99,.4);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0.5rem 0.75rem;}
.coach-card__name{font-size:0.875rem;font-weight:500;}
.coach-card__role{font-size:0.65rem;opacity:.8;}

.trust__controls{position:relative;z-index:20;margin-top:3rem;display:flex;align-items:center;justify-content:space-between;}
@media (min-width:640px){ .trust__controls{ margin-top:6rem; } }

/* ---------- programs ---------- */
.programs{background:var(--surface);padding:6rem 1.5rem;}
@media (min-width:640px){ .programs{ padding-left:2.5rem; padding-right:2.5rem; } }
.programs__title{font-size:3rem;font-weight:500;line-height:.95;letter-spacing:-0.01em;margin-top:1rem;}
.program-list{margin-top:3.5rem;}
.program-row{display:flex;align-items:center;gap:1.5rem;padding:1.75rem 0;border-top:1px solid var(--hairline);}
.program-row:last-child{border-bottom:1px solid var(--hairline);}
.program-row:focus-visible{background:var(--background);}
.program-row__index{width:2.5rem;font-size:0.875rem;font-weight:500;color:var(--ink-soft);flex-shrink:0;}
.program-row__body{flex:1;min-width:0;}
.program-row__name{font-size:1.5rem;font-weight:500;letter-spacing:-0.01em;}
@media (min-width:640px){ .program-row__name{ font-size:1.875rem; } }
.program-row__desc{font-size:0.875rem;color:var(--ink-soft);margin-top:0.25rem;}
.program-row__arrow-wrap{width:2.75rem;height:2.75rem;border-radius:var(--radius-pill);border:1px solid var(--hairline);display:grid;place-items:center;flex-shrink:0;overflow:hidden;}
.program-row__arrow{width:1.1rem;height:1.1rem;transition:transform .35s cubic-bezier(0.34,1.56,0.64,1),opacity .35s;opacity:.55;}
@media (min-width:769px){ .program-row:hover .program-row__arrow{ transform:translateX(8px); opacity:1; } }

/* ---------- facilities ---------- */
.facilities{background:var(--background);border-radius:var(--radius-card-lg);margin-top:-2.5rem;padding:4rem 1.5rem 5rem;position:relative;z-index:2;}
@media (min-width:640px){ .facilities{ padding-left:2.5rem; padding-right:2.5rem; } }
.facilities__grid{display:grid;grid-template-columns:1fr;align-items:end;gap:2.5rem;}
@media (min-width:768px){ .facilities__grid{ grid-template-columns:1fr 1fr; } }
.facilities__icon{width:4rem;height:4rem;border-radius:1.5rem;overflow:hidden;}
.facilities__icon img{width:100%;height:100%;object-fit:cover;}
.facilities__intro{max-width:24rem;}
.facilities__title{font-size:3rem;font-weight:500;line-height:.95;letter-spacing:-0.01em;margin-top:1.5rem;}
.facilities__body{font-size:0.875rem;color:var(--ink-soft);max-width:20rem;margin-top:1.5rem;}
.facilities__cards{display:flex;align-items:flex-end;gap:1.25rem;}
.court-card{flex:1;min-width:0;position:relative;aspect-ratio:3/4;border-radius:1.5rem;overflow:hidden;background:var(--surface);}
.court-card:nth-child(2){margin-bottom:2rem;}
.court-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(0.22,1,0.36,1);}
@media (min-width:769px){ .court-card:hover img{ transform:scale(1.03); } }
.court-card__caption{position:absolute;left:0.75rem;right:0.75rem;bottom:0.75rem;border-radius:0.75rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;padding:0.75rem 1rem;}
.court-card__caption.clay{background:rgba(15,47,99,.4);}
.court-card__caption.blue{background:rgba(11,110,151,.55);}
.court-card__name{font-size:0.875rem;font-weight:500;}
.court-card__desc{font-size:0.65rem;opacity:.85;margin-top:0.15rem;}

/* ---------- stats ---------- */
.stats{background:var(--brand-deep);color:#fff;border-radius:var(--radius-card-lg);margin-top:0.75rem;padding:5rem 1.5rem;}
@media (min-width:640px){ .stats{ padding-left:2.5rem; padding-right:2.5rem; } }
.stats__title{font-size:3rem;font-weight:500;line-height:.95;letter-spacing:-0.01em;margin-top:1rem;}
.stats__grid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:2rem;row-gap:3rem;margin-top:4rem;}
@media (min-width:1024px){ .stats__grid{ grid-template-columns:repeat(4,1fr); } }
.stat-cell{border-top:1px solid rgba(255,255,255,.2);padding-top:1.25rem;}
.stat-cell__value{font-size:3.75rem;font-weight:500;letter-spacing:-0.01em;line-height:1.05;}
@media (min-width:640px){ .stat-cell__value{ font-size:4.5rem; } }
.stat-cell__label{font-size:0.875rem;color:rgba(255,255,255,.65);margin-top:0.75rem;}

/* ---------- testimonials ---------- */
.testimonials{background:var(--background);padding:5rem 1.5rem;}
@media (min-width:640px){ .testimonials{ padding:6rem 2.5rem; } }
.testimonials__title{font-size:3rem;font-weight:500;line-height:.95;letter-spacing:-0.01em;margin-top:1rem;}
.testimonial-list{display:grid;grid-template-columns:1fr;gap:1.25rem;margin-top:3.5rem;}
@media (min-width:768px){ .testimonial-list{ grid-template-columns:repeat(3,1fr); } }
.testimonial-card{display:flex;flex-direction:column;justify-content:space-between;height:100%;border-radius:1.5rem;background:var(--surface);padding:1.75rem;transition:transform .4s cubic-bezier(0.22,1,0.36,1);}
@media (min-width:769px){ .testimonial-card:hover{ transform:translateY(-8px); } }
.testimonial-card__glyph{font-size:2.25rem;color:var(--brand);line-height:1;}
.testimonial-card__quote{font-size:1.125rem;line-height:1.6;color:var(--ink);margin-top:1rem;}
.testimonial-card__footer{border-top:1px solid var(--hairline);padding-top:1rem;margin-top:1.5rem;}
.testimonial-card__name{font-weight:500;}
.testimonial-card__role{font-size:0.875rem;color:var(--ink-soft);margin-top:0.15rem;}

/* ---------- footer ---------- */
.site-footer{background:var(--brand-deep);color:#fff;border-radius:var(--radius-card-lg);margin-top:0.75rem;padding:3.5rem 1.5rem;}
@media (min-width:640px){ .site-footer{ padding:4rem 2.5rem; } }
.footer__cta{display:flex;flex-direction:column;gap:1.5rem;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:3.5rem;}
@media (min-width:640px){ .footer__cta{ flex-direction:row; justify-content:space-between; align-items:flex-end; } }
.footer__cta-title{font-size:3.75rem;font-weight:500;line-height:.92;letter-spacing:-0.01em;margin-top:1rem;}
.footer__columns{display:grid;grid-template-columns:1fr;gap:2.5rem;padding:3.5rem 0;}
@media (min-width:768px){ .footer__columns{ grid-template-columns:1.4fr 1fr 1fr 1fr; } }
.footer__brand-col{max-width:20rem;}
.footer__brand{display:flex;align-items:center;gap:0.5rem;font-size:1.125rem;font-weight:500;text-transform:uppercase;letter-spacing:0.2em;}
.footer__brand svg{width:1.25rem;height:1.25rem;}
.footer__blurb{font-size:0.875rem;color:rgba(255,255,255,.65);margin-top:1rem;}
.footer__address{font-style:normal;margin-top:1.5rem;color:rgba(255,255,255,.8);font-size:0.875rem;display:flex;flex-direction:column;gap:0.35rem;}
@media (min-width:769px){ .footer__address a:hover{ text-decoration:underline; } }
.footer__address .muted{color:rgba(255,255,255,.55);}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);

  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

  if (size > FONT_BASE) document.documentElement.style.fontSize = size + "px";

}

  lenis.stop();
}
function unlockScroll() {
  lockCount = Math.max(0, lockCount - 1);
  if (lockCount === 0) {
    document.documentElement.style.position = "";
    document.documentElement.style.overflow = "";
    document.documentElement.style.height = "";
    lenis.start();
  }
}

/* ---------- lenis ---------- */
const lenis = new Lenis({ smoothWheel: true });
let lastT = 0;
function raf(t) {
  lenis.raf(t);
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0;
  lastT = t;
  tickSprings(dt);
  updateParallax();
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
window.scrollTo(0, 0);

document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute("href");
  if (id.length > 1 && document.querySelector(id)) {
    e.preventDefault();
    lenis.scrollTo(id);
  }
});

/* ---------- spring driver ---------- */
const activeSprings = new Set();
function createSpringState(initial = 0) {
  return { value: initial, velocity: 0, target: initial, tension: 200, friction: 26, onUpdate: null, onComplete: null };
}
function springTo(state, target, config, onUpdate, onComplete) {
  state.target = target;
  state.tension = config.tension;
  state.friction = config.friction;
  state.onUpdate = onUpdate || state.onUpdate;
  state.onComplete = onComplete || null;
  activeSprings.add(state);
}
function tickSprings(dt) {
  if (!dt) return;
  for (const s of activeSprings) {
    const force = -s.tension * (s.value - s.target) - s.friction * s.velocity;
    s.velocity += force * dt;
    s.value += s.velocity * dt;
    if (s.onUpdate) s.onUpdate(s.value);
    if (Math.abs(s.target - s.value) < 0.001 && Math.abs(s.velocity) < 0.02) {
      s.value = s.target;
      s.velocity = 0;
      if (s.onUpdate) s.onUpdate(s.value);
      activeSprings.delete(s);
      const cb = s.onComplete;
      s.onComplete = null;
      if (cb) cb();
    }
  }
}

/* ---------- scroll parallax ---------- */
const parallaxItems = [];
function addParallax(getElm, from, to, axis, unit, getRect) {
  parallaxItems.push({ getElm, from, to, axis, unit, getRect });
}
function updateParallax() {
  const vh = window.innerHeight;
  for (const p of parallaxItems) {
    const elm = p.getElm();
    if (!elm) continue;
    const rect = p.getRect();
    if (!rect) continue;
    let progress = (vh - rect.top) / (vh + rect.height);
    progress = Math.min(1, Math.max(0, progress));
    const val = p.from + (p.to - p.from) * progress;
    elm.style.transform = `translate${p.axis}(${val}${p.unit})`;
  }
}

/* ---------- generic spring reveal (Inview) ---------- */
function springReveal(elm, from, to, config, { delay = 0, threshold = 0.2 } = {}) {
  const state = {
    x: createSpringState(from.x ?? 0),
    y: createSpringState(from.y ?? 0),
    scale: createSpringState(from.scale ?? 1),
    opacity: createSpringState(from.opacity ?? 1)
  };
  function apply() {
    elm.style.opacity = String(state.opacity.value);
    elm.style.transform = `translate3d(${state.x.value}px, ${state.y.value}px, 0) scale(${state.scale.value})`;
  }
  apply();
  let remaining = 0;
  function done() {
    remaining--;
    if (remaining <= 0) {
      elm.style.transform = "";
      elm.style.opacity = "";
    }
  }
  function play() {
    const keys = ["x", "y", "scale", "opacity"].filter((k) => to[k] !== undefined);
    remaining = keys.length;
    keys.forEach((k) => springTo(state[k], to[k], config, apply, done));
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        setTimeout(play, delay);
        io.unobserve(elm);
      }
    });
  }, { threshold });
  io.observe(elm);
  return { play };
}

/* ---------- clip-mask word/line reveal ---------- */
function buildClipLines(container, lines) {
  container.innerHTML = "";
  const inners = [];
  lines.forEach((line) => {
    const inner = el("span", { class: "clip-line__inner", text: line });
    container.append(el("span", { class: "clip-line" }, [inner]));
    inners.push(inner);
  });
  return inners;
}
function buildClipWords(container, words) {
  container.innerHTML = "";
  const inners = [];
  words.forEach((w, i) => {
    const inner = el("span", { class: "clip-word__inner", text: w });
    container.append(el("span", { class: "clip-word" }, [inner]));
    if (i < words.length - 1) container.append(document.createTextNode(" "));
    inners.push(inner);
  });
  return inners;
}
function playClipReveal(inners, { stagger = 0, baseDelay = 0, duration = 950 } = {}) {
  inners.forEach((inner, i) => {
    inner.style.transitionDuration = duration + "ms";
    inner.style.transitionDelay = baseDelay + i * stagger + "ms";
  });
  requestAnimationFrame(() => {
    requestAnimationFrame(() => inners.forEach((inner) => inner.classList.add("in")));
  });
}
function resetClipReveal(inners) {
  inners.forEach((inner) => inner.classList.remove("in"));
  void inners[0]?.offsetHeight;
}
function stackedLines(container, lines, opts = {}) {
  const inners = buildClipLines(container, lines);
  playClipReveal(inners, { stagger: 120, baseDelay: 0, duration: 950, ...opts });
  return inners;
}
function stackedLinesInview(container, lines, opts = {}) {
  const inners = buildClipLines(container, lines);
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        playClipReveal(inners, { stagger: 120, baseDelay: 0, duration: 950, ...opts });
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  io.observe(container);
  return inners;
}

/* ---------- word fade reveal ---------- */
function buildWordFade(container, text) {
  container.innerHTML = "";
  const words = text.split(" ");
  const spans = [];
  words.forEach((w, i) => {
    const s = el("span", { class: "word-fade", text: w });
    container.append(s);
    if (i < words.length - 1) container.append(document.createTextNode(" "));
    spans.push(s);
  });
  return spans;
}
function playWordFade(spans, { wordStagger = 28, delayIn = 0, duration = 700 } = {}) {
  spans.forEach((s, i) => {
    s.style.transitionDuration = duration + "ms";
    s.style.transitionDelay = delayIn + i * wordStagger + "ms";
  });
  requestAnimationFrame(() => {
    requestAnimationFrame(() => spans.forEach((s) => s.classList.add("in")));
  });
}

/* ---------- crossfade (carousels) ---------- */
function initCrossfade(elm) {
  elm._cf = { o: createSpringState(1), y: createSpringState(0), s: createSpringState(1) };
}
function applyCrossfade(elm) {
  const s = elm._cf;
  elm.style.opacity = String(s.o.value);
  elm.style.transform = `translateY(${s.y.value}px) scale(${s.s.value})`;
}
function crossfadeAdvance(elm, renderFn, config = { tension: 210, friction: 24 }, withMotion = true) {
  const s = elm._cf;
  const to = withMotion ? { o: 0, y: 16, s: 0.96 } : { o: 0, y: 0, s: 1 };
  springTo(s.o, to.o, config, () => applyCrossfade(elm), () => {
    renderFn();
    s.o.value = 0; s.o.velocity = 0;
    s.y.value = to.y; s.y.velocity = 0;
    s.s.value = to.s; s.s.velocity = 0;
    applyCrossfade(elm);
    springTo(s.o, 1, config, () => applyCrossfade(elm));
    springTo(s.y, 0, config, () => applyCrossfade(elm));
    springTo(s.s, 1, config, () => applyCrossfade(elm));
  });
  springTo(s.y, to.y, config, () => applyCrossfade(elm));
  springTo(s.s, to.s, config, () => applyCrossfade(elm));
}

/* ---------- loader ---------- */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const MIN_VISIBLE_MS = reducedMotion ? 200 : 1400;
const MAX_VISIBLE_MS = reducedMotion ? 200 : 2600;
const EXIT_MS = reducedMotion ? 0 : 850;

let ready = false;
const readyCallbacks = [];
function onReady(cb) {
  if (ready) cb();
  else readyCallbacks.push(cb);
}

function initLoader() {
  const loaderEl = $("#loader");
  const markEl = $("#loader-mark");
  const fillEl = $("#loader-fill");
  $("#loader-mark-icon").innerHTML = ICONS.mark;
  $("#loader-wordmark").textContent = CONTENT.site.name;

  lockScroll();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      markEl.classList.add("in");
      fillEl.style.transitionDelay = "120ms";
      fillEl.style.transitionDuration = (MIN_VISIBLE_MS - 120) + "ms";
      fillEl.classList.add("in");
    });
  });

  let finished = false;
  function finishLoader() {
    if (finished) return;
    finished = true;
    ready = true;
    readyCallbacks.splice(0).forEach((cb) => cb());
    unlockScroll();
    loaderEl.classList.add("exit");
    setTimeout(() => loaderEl.remove(), EXIT_MS);
  }

  const minTimer = new Promise((res) => setTimeout(res, MIN_VISIBLE_MS));
  const loadEvent = document.readyState === "complete"
    ? Promise.resolve()
    : new Promise((res) => window.addEventListener("load", res, { once: true }));
  Promise.all([minTimer, loadEvent]).then(finishLoader);
  setTimeout(finishLoader, MAX_VISIBLE_MS);
}

  ]);
  $(".footer__brand", brandCol).append(el("span", { text: CONTENT.site.name }));
  columnsEl.append(brandCol);

  f.navColumns.forEach((col) => {
    columnsEl.append(
      el("nav", {}, [
        el("div", { class: "footer__nav-heading", text: col.heading }),
        el("ul", { class: "footer__nav-list" }, col.links.map((link) => el("li", {}, [el("a", { href: link.href, text: link.label })])))
      ])
    );
  });

  $("#footer-copyright").textContent = f.copyright;

  const socialEl = $("#footer-social");
  f.socialLinks.forEach((s) => socialEl.append(el("a", { href: s.href, text: s.label })));

  const legalEl = $("#footer-legal");
  f.legalLinks.forEach((l) => legalEl.append(el("a", { href: l.href, text: l.label })));
}

/* ---------- menu overlay ---------- */
const menuSprings = { backdrop: createSpringState(0), opacity: createSpringState(0), y: createSpringState(-24) };
let menuLinkEls = [];
let menuOpen = false;
let menuReturnFocus = null;

function renderMenu() {
  const m = CONTENT.menu;
  const brand = $("#menu-brand");
  brand.innerHTML = ICONS.mark;
  brand.append(el("span", { text: CONTENT.site.name }));

  const closeBtn = $("#menu-close");
  closeBtn.innerHTML = ICONS.close;
  closeBtn.setAttribute("aria-label", m.closeAriaLabel);
  closeBtn.addEventListener("click", closeMenu);

  const nav = $("#menu-nav");
  nav.innerHTML = "";
  menuLinkEls = m.links.map((link) => {
    const a = el("a", { href: link.href, text: link.label });
    a.addEventListener("click", closeMenu);
    nav.append(a);
    return a;
  });

  const bookBtn = $("#menu-book");
  bookBtn.append(el("span", { text: m.bookVisit }), el("span", { class: "pill-btn__arrow", html: ICONS.arrow }));
  bookBtn.addEventListener("click", () => { closeMenu(); openModal(); });

  const socialEl = $("#menu-social");
  CONTENT.footer.socialLinks.forEach((s) => socialEl.append(el("a", { href: s.href, text: s.label })));

  $("#menu-backdrop").addEventListener("click", closeMenu);
}

function applyMenuStyles() {
  $("#menu-backdrop").style.opacity = String(menuSprings.backdrop.value);
  const panel = $("#menu-panel");
  panel.style.opacity = String(menuSprings.opacity.value);
  panel.style.transform = `translateY(${menuSprings.y.value}px)`;
}

function openMenu() {
  if (menuOpen) return;
  menuOpen = true;
  menuReturnFocus = document.activeElement;
  lockScroll();
  const overlay = $("#menu-overlay");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  springTo(menuSprings.backdrop, 1, { tension: 260, friction: 30 }, applyMenuStyles);
  springTo(menuSprings.opacity, 1, { tension: 220, friction: 28 }, applyMenuStyles);
  springTo(menuSprings.y, 0, { tension: 220, friction: 28 }, applyMenuStyles);

  menuLinkEls.forEach((a, i) => {
    const state = { opacity: createSpringState(0), y: createSpringState(28) };
    const apply = () => { a.style.opacity = String(state.opacity.value); a.style.transform = `translateY(${state.y.value}px)`; };
    apply();
    setTimeout(() => {
      if (!menuOpen) return;
      springTo(state.opacity, 1, { tension: 200, friction: 26 }, apply);
      springTo(state.y, 0, { tension: 200, friction: 26 }, apply);
    }, 120 + i * 70);
  });

  setTimeout(() => $("#menu-close").focus(), 120);
}

function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  const overlay = $("#menu-overlay");
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  springTo(menuSprings.backdrop, 0, { tension: 260, friction: 30 }, applyMenuStyles);
  springTo(menuSprings.opacity, 0, { tension: 220, friction: 28 }, applyMenuStyles);
  springTo(menuSprings.y, -24, { tension: 220, friction: 28 }, applyMenuStyles);
  menuLinkEls.forEach((a) => { a.style.opacity = "0"; a.style.transform = "translateY(28px)"; });
  unlockScroll();
  if (menuReturnFocus && menuReturnFocus.focus) menuReturnFocus.focus();
}

/* ---------- contact modal ---------- */
const modalSprings = { backdrop: createSpringState(0), opacity: createSpringState(0), y: createSpringState(28), scale: createSpringState(0.96) };
let modalOpen = false;
let modalReturnFocus = null;
let modalTitleInners = [];

function renderModal() {
  const m = CONTENT.contactModal;
  $("#modal-eyebrow").append(eyebrow(m.eyebrow, "dark"));
  modalTitleInners = buildClipLines($("#modal-title"), m.titleLines);

  const closeBtn = $("#modal-close");
  closeBtn.innerHTML = ICONS.close;
  closeBtn.setAttribute("aria-label", m.closeAriaLabel);
  closeBtn.addEventListener("click", closeModal);

  $("#label-name").textContent = m.fields.name.label;
  $("#field-name").setAttribute("placeholder", m.fields.name.placeholder);
  $("#label-email").textContent = m.fields.email.label;
  $("#field-email").setAttribute("placeholder", m.fields.email.placeholder);
  $("#label-message").textContent = m.fields.message.label;
  $("#field-message").setAttribute("placeholder", m.fields.message.placeholder);

  $("#modal-submit").textContent = m.submit;
  $("#modal-success-icon").innerHTML = ICONS.check;
  $("#modal-success-title").textContent = m.successTitle;
  $("#modal-done").textContent = m.done;
  $("#modal-done").addEventListener("click", closeModal);

  $("#modal-backdrop").addEventListener("click", closeModal);
  $("#modal-form").addEventListener("submit", handleModalSubmit);
}

function applyModalStyles() {
  $("#modal-backdrop").style.opacity = String(modalSprings.backdrop.value);
  const panel = $("#modal-panel");
  panel.style.opacity = String(modalSprings.opacity.value);
  panel.style.transform = `translateY(${modalSprings.y.value}px) scale(${modalSprings.scale.value})`;
}

function openModal() {
  if (modalOpen) return;
  modalOpen = true;
  modalReturnFocus = document.activeElement;
  lockScroll();
  const overlay = $("#modal-overlay");
  overlay.classList.add("open");
  springTo(modalSprings.backdrop, 1, { tension: 240, friction: 30 }, applyModalStyles);
  springTo(modalSprings.opacity, 1, { tension: 240, friction: 26 }, applyModalStyles);
  springTo(modalSprings.y, 0, { tension: 240, friction: 26 }, applyModalStyles);
  springTo(modalSprings.scale, 1, { tension: 240, friction: 26 }, applyModalStyles);

  resetClipReveal(modalTitleInners);
  playClipReveal(modalTitleInners, { stagger: 90, duration: 800 });

  setTimeout(() => $("#field-name").focus(), 120);
}

function closeModal() {
  if (!modalOpen) return;
  modalOpen = false;
  const overlay = $("#modal-overlay");
  overlay.classList.remove("open");
  springTo(modalSprings.backdrop, 0, { tension: 240, friction: 30 }, applyModalStyles);
  springTo(modalSprings.opacity, 0, { tension: 240, friction: 26 }, applyModalStyles);
  springTo(modalSprings.y, 28, { tension: 240, friction: 26 }, applyModalStyles);
  springTo(modalSprings.scale, 0.96, { tension: 240, friction: 26 }, applyModalStyles);
  unlockScroll();
  if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus();
  setTimeout(resetModalForm, 350);
}

function resetModalForm() {
  $("#modal-form").reset();
  $("#modal-form").hidden = false;
  $("#modal-success").hidden = true;
  const submitBtn = $("#modal-submit");
  submitBtn.disabled = false;
  submitBtn.textContent = CONTENT.contactModal.submit;
}

function handleModalSubmit(e) {
  e.preventDefault();
  const submitBtn = $("#modal-submit");
  submitBtn.disabled = true;
  submitBtn.textContent = CONTENT.contactModal.submitting;
  const fullName = $("#field-name").value.trim();
  const firstName = fullName.split(" ")[0];
  setTimeout(() => {
    $("#modal-form").hidden = true;
    $("#modal-success").hidden = false;
    $("#modal-success-text").textContent = CONTENT.contactModal.successMessage({ firstName });
  }, 900);
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (modalOpen) closeModal();
  else if (menuOpen) closeMenu();
});

/* ---------- init ---------- */
function init() {
  initLoader();
  renderHeader();
  renderHero();
  renderTrust();
  renderPrograms();
  renderFacilities();
  renderStats();
  renderTestimonials();
  renderFooter();
  renderMenu();
  renderModal();
}
init();
</script>
</body>
</html>
